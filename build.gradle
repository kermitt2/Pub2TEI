plugins {
    id 'application'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'base'
    id 'com.gradleup.shadow' version '9.4.1'
}

repositories {
    mavenLocal()
    mavenCentral()
}

import org.apache.tools.ant.taskdefs.condition.Os

group = 'org.pub2tei'
version = '0.3'

description = """transform the myriad of scientific publisher XML into the same TEI XML format, common to GROBID"""

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

sourceSets.main.resources {
    srcDirs = ["src/main/resources"]
}

processResources {
    filesMatching('./config/pub2tei.yml') {
        filter {
            it.replace('project.version', project.property('version_placeholder'))
        }
    }
}

configurations {
    all*.exclude group: 'org.slf4j', module: "slf4j-log4j12"
    all*.exclude group: 'org.slf4j', module: "slf4j-jdk14"
    all*.exclude group: 'log4j', module: "log4j"
}

tasks.register('install') {
    dependsOn 'installShadowDist'
}

dependencies {
    // GROBID — consumed as a fat jar from localLibs/ because the grobid.s3 Maven repo
    // was shut down and 0.9.0 is not published to Maven Central. The fat jar bundles its
    // own commons-io, commons-lang3, langdetect and grobid-lucene-analysers; do NOT
    // re-declare those as Maven deps or the duplicate classes will fight on the classpath.
    // However, grobid-core references opennlp.tools.sentdetect.SentenceModel (via
    // SentenceUtilities) at runtime and the fat jar does NOT bundle opennlp, so we must
    // declare opennlp-tools explicitly here or the sentence segmenter fails to load.
    implementation files('localLibs/grobid-core-0.9.0.jar')
    implementation 'org.apache.opennlp:opennlp-tools:1.9.4'
    implementation 'black.ninia:jep:4.3.1'

    // Dropwizard stack
    implementation platform('io.dropwizard:dropwizard-bom:4.0.10')
    implementation 'io.dropwizard:dropwizard-core'
    implementation 'io.dropwizard:dropwizard-assets'
    implementation 'io.dropwizard:dropwizard-forms'
    implementation 'io.dropwizard:dropwizard-client'
    implementation 'io.dropwizard:dropwizard-auth'
    implementation 'io.dropwizard:dropwizard-testing'
    implementation 'io.dropwizard.metrics:metrics-core:4.2.28'
    implementation 'io.dropwizard.metrics:metrics-servlets:4.2.28'
    implementation 'ru.vyarus:dropwizard-guicey:7.2.1'

    // XML / XSLT
    implementation 'net.sf.saxon:Saxon-HE:9.9.1-8'
    implementation 'xerces:xercesImpl:2.12.2'

    // Jackson (YAML config + JSON)
    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    // Logging (slf4j 2.x + logback 1.5.x must bump together; CVE-2023-6378)
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.13'

    // Apache Commons — only those NOT bundled by the grobid fat jar.
    // Both collections versions are needed: XMLUtilities imports the v3 package
    // (org.apache.commons.collections.CollectionUtils), grobid-core internals use v4
    // (org.apache.commons.collections4.CollectionUtils). The two libraries use
    // different root packages so they coexist without conflict.
    implementation 'commons-collections:commons-collections:3.2.2'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'commons-beanutils:commons-beanutils:1.9.4'
    implementation 'org.apache.commons:commons-compress:1.27.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.easymock:easymock:5.4.0'
    testImplementation 'org.xmlunit:xmlunit-matchers:2.10.0'
    testImplementation 'org.xmlunit:xmlunit-legacy:2.10.0'
}



shadowJar {
    archiveClassifier = 'onejar'
    mergeServiceFiles()
    zip64 = true
    manifest {
        attributes 'Main-Class': 'org.pub2tei.main.Main'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    configurations = [project.configurations.runtimeClasspath]
}

jar {
    dependsOn shadowJar
    enabled = true
}

tasks.named('assemble') {
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
}

//////////
// service
application {
    mainClass = 'org.pub2tei.service.ServiceApplication'
}

tasks.named('run') {
    def libraries = ""
    if (Os.isFamily(Os.FAMILY_MAC)) {
        if (Os.OS_ARCH.equals("aarch64")) {
            libraries = "${file("../grobid/grobid-home/lib/mac_arm-64").absolutePath}"
        } else {
            libraries = "${file("../grobid/grobid-home/lib/mac-64").absolutePath}"
        }
    } else if (Os.isFamily(Os.FAMILY_UNIX)) {
        libraries = "${file("../grobid/grobid-home/lib/lin-64/jep").absolutePath}:" +
            "${file("../grobid/grobid-home/lib/lin-64").absolutePath}"
    } else {
        throw new RuntimeException("Unsupported platform!")
    }

    jvmArgs "--add-opens", "java.base/java.lang=ALL-UNNAMED"
    workingDir = rootProject.rootDir

    def javaLibraryPath = "${System.getProperty('java.library.path')}:" + libraries
    systemProperty "java.library.path", javaLibraryPath

    args = ['server', 'resources/config/config.yml']
}

